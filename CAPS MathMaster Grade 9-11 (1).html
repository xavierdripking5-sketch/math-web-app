<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAPS MathMaster | Grade 9–11 Wiskunde</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            },
            emerald: {
              500: '#10b981',
              600: '#059669',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            math: ['Cambria Math', 'Times New Roman', 'serif']
          }
        }
      }
    };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .math-expr { font-family: 'Cambria Math', 'Georgia', serif; letter-spacing: 0.02em; }
    .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 3px; font-size: 0.9em; }
    .frac-num { border-bottom: 1.5px solid currentColor; padding: 0 4px 1px; line-height: 1.1; }
    .frac-den { padding: 1px 4px 0; line-height: 1.1; }
    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      70% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop { animation: popIn 0.35s ease-out forwards; }
    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.5); }
      70% { box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); }
      100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
    }
    .speaking-pulse { animation: pulseRing 1.5s infinite; }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200 min-h-screen flex flex-col">

  <!-- TOP NAVIGATION & GAMIFICATION BAR -->
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 h-16 flex items-center justify-between gap-2">
      <!-- Logo & Mobile Menu Button -->
      <div class="flex items-center gap-2.5">
        <button id="mobileMenuBtn" class="lg:hidden p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800" aria-label="Menu">
          <i class="fa-solid fa-bars text-lg"></i>
        </button>
        <div onclick="setActiveTab('learn')" class="cursor-pointer flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-600 to-purple-600 flex items-center justify-center text-white font-bold shadow-md">
            <span class="math-expr text-lg">∑π</span>
          </div>
          <div>
            <h1 class="font-extrabold text-base sm:text-lg leading-tight tracking-tight bg-gradient-to-r from-brand-600 to-purple-600 bg-clip-text text-transparent">CAPS MathMaster</h1>
            <p id="headerSubtitle" class="text-[11px] text-slate-500 dark:text-slate-400 hidden sm:block">Grade 9–11 Interactive Study Hub</p>
          </div>
        </div>
      </div>

      <!-- XP, Level & Streak Pill -->
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- XP & Level Badge -->
        <div onclick="showAchievementsModal()" class="cursor-pointer flex items-center gap-2 bg-amber-50 dark:bg-amber-950/50 border border-amber-200 dark:border-amber-800/60 px-2.5 py-1.5 rounded-xl hover:scale-[1.02] transition" title="Click to view Level & Badges">
          <div class="w-6 h-6 rounded-full bg-amber-500 text-white flex items-center justify-center text-xs font-bold shadow-sm">
            <i class="fa-solid fa-star"></i>
          </div>
          <div class="leading-none">
            <div class="flex items-center gap-1.5">
              <span id="xpDisplay" class="font-extrabold text-xs sm:text-sm text-amber-700 dark:text-amber-300">0 XP</span>
              <span id="levelBadge" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-200/80 dark:bg-amber-800 text-amber-900 dark:text-amber-100">Lvl 1</span>
            </div>
            <div class="w-16 sm:w-24 h-1.5 bg-amber-200 dark:bg-amber-900 rounded-full mt-1 overflow-hidden">
              <div id="xpProgressBar" class="h-full bg-amber-500 transition-all duration-500" style="width: 10%"></div>
            </div>
          </div>
        </div>

        <!-- Streak Pill -->
        <div class="hidden md:flex items-center gap-1.5 bg-orange-50 dark:bg-orange-950/40 border border-orange-200 dark:border-orange-800/50 px-2.5 py-1.5 rounded-xl text-orange-600 dark:text-orange-400 font-bold text-xs">
          <i class="fa-solid fa-fire"></i>
          <span id="streakDisplay">1d</span>
        </div>

        <!-- Language Switcher (EN / AF) -->
        <div class="flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded-xl border border-slate-200 dark:border-slate-700">
          <button id="langEnBtn" onclick="setLanguage('en')" class="px-2.5 py-1 rounded-lg text-xs font-bold transition bg-white dark:bg-slate-700 text-brand-600 dark:text-white shadow-sm">EN</button>
          <button id="langAfBtn" onclick="setLanguage('af')" class="px-2.5 py-1 rounded-lg text-xs font-bold transition text-slate-600 dark:text-slate-400 hover:text-slate-900">AF</button>
        </div>

        <!-- Dark Mode Toggle -->
        <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition" aria-label="Toggle theme">
          <i id="themeIcon" class="fa-solid fa-moon"></i>
        </button>
      </div>
    </div>

    <!-- SECONDARY MODE NAVIGATION BAR -->
    <div class="bg-slate-50/80 dark:bg-slate-900/60 border-t border-slate-200/70 dark:border-slate-800/70">
      <div class="max-w-7xl mx-auto px-3 sm:px-6 flex items-center justify-between overflow-x-auto no-scrollbar py-1.5 gap-2">
        <div class="flex items-center gap-1.5 sm:gap-2">
          <button onclick="setActiveTab('learn')" id="tab-learn" class="nav-tab flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold whitespace-nowrap transition bg-brand-600 text-white shadow-sm">
            <i class="fa-solid fa-book-open"></i> <span data-i18n="navLearn">Study Lessons</span>
          </button>
          <button onclick="setActiveTab('directory')" id="tab-directory" class="nav-tab flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold whitespace-nowrap transition text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-800">
            <i class="fa-solid fa-list-check text-indigo-500"></i> <span data-i18n="navDirectory">Topic Directory</span>
          </button>
          <button onclick="setActiveTab('papers')" id="tab-papers" class="nav-tab flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold whitespace-nowrap transition text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-800">
            <i class="fa-solid fa-file-lines text-purple-500"></i> <span data-i18n="navPapers">Term 1–4 Papers</span>
          </button>
          <button onclick="setActiveTab('quiz')" id="tab-quiz" class="nav-tab flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold whitespace-nowrap transition text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-800">
            <i class="fa-solid fa-circle-question"></i> <span data-i18n="navQuiz">Topic Quiz</span>
          </button>
          <button onclick="setActiveTab('test')" id="tab-test" class="nav-tab flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold whitespace-nowrap transition text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-800">
            <i class="fa-solid fa-stopwatch"></i> <span data-i18n="navTest">Mock Tests</span>
          </button>
          <button onclick="setActiveTab('daily')" id="tab-daily" class="nav-tab flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold whitespace-nowrap transition text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-800">
            <i class="fa-solid fa-bolt text-amber-500"></i> <span data-i18n="navDaily">Daily Challenge</span>
          </button>
          <button onclick="setActiveTab('games')" id="tab-games" class="nav-tab flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold whitespace-nowrap transition text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-800">
            <i class="fa-solid fa-gamepad text-emerald-500"></i> <span data-i18n="navGames">Math Games</span>
          </button>
        </div>

        <!-- Grade Quick Selector -->
        <div class="flex items-center gap-1 bg-white dark:bg-slate-800 p-1 rounded-lg border border-slate-200 dark:border-slate-700 shrink-0">
          <button onclick="selectGrade(9)" id="gradeBtn-9" class="grade-btn px-2.5 py-1 rounded text-xs font-bold transition bg-brand-100 dark:bg-brand-900/60 text-brand-700 dark:text-brand-200">Gr 9</button>
          <button onclick="selectGrade(10)" id="gradeBtn-10" class="grade-btn px-2.5 py-1 rounded text-xs font-bold transition text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700">Gr 10</button>

    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <div class="flex-1 max-w-7xl w-full mx-auto flex relative">

    <!-- SIDEBAR (CURRICULUM TOPICS) -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-30 w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 transform -translate-x-full lg:translate-x-0 lg:static lg:block transition-transform duration-200 ease-in-out flex flex-col pt-16 lg:pt-0">
      <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
        <div>
          <span id="sidebarGradeTitle" class="text-xs font-extrabold uppercase tracking-wider text-brand-600 dark:text-brand-400">Grade 9 CAPS</span>
          <h2 id="sidebarCurriculumHeading" class="font-bold text-sm text-slate-800 dark:text-slate-200">Curriculum Topics</h2>
        </div>
        <button id="closeSidebarBtn" class="lg:hidden p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <!-- Search Topics -->
      <div class="p-3 border-b border-slate-100 dark:border-slate-800/80">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
          <input id="topicSearchInput" type="text" oninput="renderSidebar()" placeholder="Search topics..." class="w-full pl-8 pr-3 py-1.5 text-xs rounded-lg bg-slate-100 dark:bg-slate-800 border border-transparent focus:border-brand-500 focus:bg-white dark:focus:bg-slate-900 outline-none transition" />
        </div>
      </div>
      <!-- Topic List -->
      <div id="topicList" class="flex-1 overflow-y-auto p-3 space-y-1.5">
        <!-- Populated dynamically -->
      </div>
      <!-- Sidebar Footer Progress -->
      <div class="p-4 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50">
        <div class="flex justify-between text-xs font-semibold mb-1">

        </div>
        <div class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">

        </div>
      </div>
    </aside>

    <!-- MOBILE OVERLAY -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-slate-950/50 z-20 hidden lg:hidden" onclick="toggleMobileSidebar(false)"></div>

    <!-- MAIN CONTENT PANEL -->
    <main id="mainContent" class="flex-1 p-4 sm:p-6 lg:p-8 overflow-x-hidden">
      <!-- Dynamic View Container -->
      <div id="viewContainer"></div>
    </main>
  </div>

        <i class="fa-solid fa-bolt"></i>
      </div>
      <div>

        <p id="xpToastDesc" class="text-xs text-slate-300">Great job keeping up your momentum!</p>
      </div>
    </div>
  </div>

  <!-- ACHIEVEMENTS & PROFILE MODAL -->

          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div class="py-4 space-y-4">
        <div class="grid grid-cols-3 gap-3 text-center">
          <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200/60 dark:border-slate-700">
            <p id="statTotalXp" class="text-xl font-extrabold text-amber-500">0</p>
            <p class="text-[11px] font-semibold text-slate-500 uppercase" data-i18n="totalXpLabel">Total XP</p>
          </div>
          <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200/60 dark:border-slate-700">
            <p id="statQuizzesDone" class="text-xl font-extrabold text-brand-600 dark:text-brand-400">0</p>
            <p class="text-[11px] font-semibold text-slate-500 uppercase" data-i18n="quizzesDoneLabel">Quizzes Solved</p>
          </div>
          <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200/60 dark:border-slate-700">
            <p id="statHighScore" class="text-xl font-extrabold text-emerald-500">0</p>
            <p class="text-[11px] font-semibold text-slate-500 uppercase" data-i18n="gameBestLabel">Game Best</p>
          </div>
        </div>
        <div>
          <h4 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2" data-i18n="unlockedBadges">Badges & Milestones</h4>
          <div id="badgesGrid" class="grid grid-cols-2 gap-2.5 max-h-60 overflow-y-auto pr-1"></div>
        </div>
      </div>
      <div class="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end">
        <button onclick="closeAchievementsModal()" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-sm font-bold hover:bg-brand-700 transition" data-i18n="closeBtn">Close</button>
      </div>
    </div>
  </div>

let speechRate = 1.0;

function stopVoice() {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  const btn = document.getElementById('voicePlayBtn');
  if (btn) btn.classList.remove('speaking-pulse');
}

function cleanMathForSpeech(text, lang) {
  let cleaned = text
    .replace(/²/g, lang === 'af' ? ' kwadraat ' : ' squared ')
    .replace(/³/g, lang === 'af' ? ' tot die derde mag ' : ' cubed ')
    .replace(/√/g, lang === 'af' ? ' vierkantswortel van ' : ' square root of ')
    .replace(/±/g, lang === 'af' ? ' plus of minus ' : ' plus or minus ')
    .replace(/⇒/g, lang === 'af' ? ' dus ' : ' therefore ')
    .replace(/≠/g, lang === 'af' ? ' nie gelyk aan ' : ' not equal to ')
    .replace(/≤/g, lang === 'af' ? ' kleiner of gelyk aan ' : ' less than or equal to ')
    .replace(/≥/g, lang === 'af' ? ' groter of gelyk aan ' : ' greater than or equal to ')
    .replace(/∠/g, lang === 'af' ? ' hoek ' : ' angle ')
    .replace(/⊥/g, lang === 'af' ? ' loodreg op ' : ' perpendicular to ')
    .replace(/Δ/g, ' delta ')
    .replace(/θ/g, ' theta ')
    .replace(/π/g, ' pi ');
  return cleaned;
}

function speakCurrentLesson() {
  if (!('speechSynthesis' in window)) return;
  stopVoice();

  const topic = getCurrentTopic();
  const lang = state.lang;
  const t = UI_TEXT[lang];

  let script = `${topic.title[lang]}. `;
  script += `${topic.explanation[lang]} `;
  script += `${lang === 'en' ? 'Key formulas include: ' : 'Belangrike formules sluit in: '} `;
  topic.formulas.forEach(f => {
    script += `${f.desc[lang]}: ${f.expr}. `;
  });
  if (topic.examples[0]) {
    script += `${lang === 'en' ? 'Let us walk through an example. ' : 'Kom ons kyk na n voorbeeld. '} `;
    script += `${topic.examples[0].problem[lang]}. `;
    script += topic.examples[0].steps[lang].join('. ');
  }

  const utterance = new SpeechSynthesisUtterance(cleanMathForSpeech(script, lang));
  const voices = window.speechSynthesis.getVoices();
  if (lang === 'af') {
    const afVoice = voices.find(v => v.lang.toLowerCase().includes('af')) || voices.find(v => v.lang.toLowerCase().includes('nl')) || voices.find(v => v.lang.toLowerCase().includes('en-za'));
    if (afVoice) utterance.voice = afVoice;
    utterance.lang = 'af-ZA';
  } else {
    const enVoice = voices.find(v => v.lang.toLowerCase().includes('en-za')) || voices.find(v => v.lang.toLowerCase().includes('en-gb')) || voices.find(v => v.lang.startsWith('en'));
    if (enVoice) utterance.voice = enVoice;
    utterance.lang = 'en-ZA';
  }
  utterance.rate = speechRate;

  const btn = document.getElementById('voicePlayBtn');
  if (btn) btn.classList.add('speaking-pulse');
  utterance.onend = () => { if (btn) btn.classList.remove('speaking-pulse'); };
  utterance.onerror = () => { if (btn) btn.classList.remove('speaking-pulse'); };

  window.speechSynthesis.speak(utterance);
}

function setSpeechRate(rate) {
  speechRate = rate;
  document.querySelectorAll('.rate-btn').forEach(b => {
    b.classList.remove('bg-brand-600', 'text-white');
    b.classList.add('bg-slate-100', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-300');

  }
}

async function generateAiExtraTip() {
  const box = document.getElementById('aiTutorOutput');
  const btn = document.getElementById('aiGenerateBtn');
  const topic = getCurrentTopic();
  const lang = state.lang;
  const t = UI_TEXT[lang];

  box.classList.remove('hidden');
  box.innerHTML = `<div class="flex items-center gap-2 text-xs font-semibold text-brand-600 dark:text-brand-400"><i class="fa-solid fa-spinner fa-spin"></i> ${t.aiGenerating}</div>`;
  btn.disabled = true;

  const prompt = lang === 'en'
    ? `You are an encouraging South African CAPS Grade ${topic.grade} Mathematics tutor. Topic: "${topic.title.en}". Give 1 short exam memory trick/common mistake warning, and 1 brand new worked example with 3 clear steps. Keep it concise, plain text with clean math symbols (², √, ÷, ×), under 140 words.`
    : `Jy is 'n bemoedigende Suid-Afrikaanse KABV Graad ${topic.grade} Wiskunde-onderwyser. Onderwerp: "${topic.title.af}". Gee 1 kort eksamen-wenk of waarskuwing teen 'n algemene fout, en 1 splinternuwe uitgewerkte voorbeeld met 3 duidelike stappe. Hou dit bondig in Afrikaans onder 140 woorde.`;

  try {
    const apiKey = "";
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
    let resultText = null;
    for (let attempt = 0; attempt < 3; attempt++) {
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });
      if (resp.ok) {
        const data = await resp.json();
        resultText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        break;
      }
      await new Promise(r => setTimeout(r, 1000 * Math.pow(2, attempt)));
    }
    if (!resultText) throw new Error('Fallback');
    const formatted = resultText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
    box.innerHTML = `
      <div class="text-xs sm:text-sm leading-relaxed text-slate-700 dark:text-slate-200 space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-bold uppercase tracking-wider text-purple-600 dark:text-purple-400"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i> Gemini AI Tutor</span>
          <button onclick="speakCustomText(this)" data-speech="${resultText.replace(/"/g, '&quot;')}" class="text-xs font-bold text-brand-600 dark:text-brand-400 hover:underline"><i class="fa-solid fa-volume-high mr-1"></i> ${lang === 'en' ? 'Listen' : 'Luister'}</button>
        </div>
        <div>${formatted}</div>
      </div>`;
  } catch (err) {
    // Offline/Fallback smart tip tailored to topic
    const fallback = lang === 'en'
      ? `<strong>Exam Pro-Tip for ${topic.title.en}:</strong> Always write down the general formula first before substituting values—CAPS markers award a dedicated formula mark! Double-check signs when expanding brackets or transposing terms.`
      : `<strong>Eksamen-wenk vir ${topic.title.af}:</strong> Skryf altyd eers die algemene formule neer voordat jy waardes invervang—KABV-nasieners gee 'n aparte punt vir die formule! Kontroleer tekens dubbel wanneer jy hakies uitbrei.`;
    box.innerHTML = `<div class="text-xs sm:text-sm leading-relaxed text-slate-700 dark:text-slate-200">${fallback}</div>`;
  } finally {
    btn.disabled = false;
  }
}

function speakCustomText(btn) {
  if (!('speechSynthesis' in window)) return;
  stopVoice();
  const raw = btn.getAttribute('data-speech') || '';
  const utt = new SpeechSynthesisUtterance(cleanMathForSpeech(raw, state.lang));
  utt.lang = state.lang === 'af' ? 'af-ZA' : 'en-ZA';

}

function selectPaperTerm(termNum) {
  state.selectedTerm = termNum;
  const match = QUESTION_PAPERS.find(p => p.grade === state.grade && p.term === termNum);
  if (match) state.selectedPaperId = match.id;
  paperAnswers = {};
  paperSubmitted = false;
  openMemos = {};
  saveState();
  renderCurrentView();
}

function togglePaperMemo(qIdx) {
  openMemos[qIdx] = !openMemos[qIdx];
  renderCurrentView();
}

function submitInteractivePaper(paper) {
  if (paperSubmitted) return;
  paperSubmitted = true;
  let earnedMarks = 0;
  paper.questions.forEach((q, idx) => {
    const u = paperAnswers[idx];
    const ok = q.type === 'number' ? Math.abs(parseFloat(u) - q.answer) < 0.01 : u === q.answer;
    if (ok) earnedMarks += q.marks;
    openMemos[idx] = true;
  });
  const xpGain = Math.max(30, earnedMarks * 10);
  awardXp(xpGain, state.lang === 'en' ? `Completed ${paper.paperType.en}!` : `${paper.paperType.af} Voltooi!`);
  renderCurrentView();
}

      .flatMap(t => t.quizzes.map(q => ({ ...q, subTopicTitle: t.title })));

}

      </div>
function submitChoiceQuiz(selectedIdx) {
  if (quizSession.answered) return;

  document.querySelectorAll('.quiz-opt-btn').forEach((btn, idx) => {

      btn.classList.add('border-rose-500', 'bg-rose-50', 'dark:bg-rose-950/40', 'text-rose-800', 'dark:text-rose-200');
    }
  });

  handleQuizResult(isCorrect, qObj.solution[state.lang]);
}

function submitNumericQuiz() {
  if (quizSession.answered) return;
  const inp = document.getElementById('numericQuizInput');
  const val = parseFloat(inp.value);
  if (isNaN(val)) return;
  quizSession.answered = true;
  inp.disabled = true;
  document.getElementById('submitNumBtn').disabled = true;

  const qObj = getActiveQuizQuestions()[quizSession.index];
  const isCorrect = Math.abs(val - qObj.answer) < 0.01;
  handleQuizResult(isCorrect, qObj.solution[state.lang]);
}

  fb.classList.remove('hidden');

      </div>
      <h2 class="text-2xl font-extrabold mb-1">${state.lang === 'en' ? "Time's Up!" : 'Tyd is Verstreke!'}</h2>
      <p class="text-4xl font-extrabold text-brand-600 dark:text-brand-400 my-3">${gameScore} pts</p>
      <p class="text-xs font-bold text-emerald-600 dark:text-emerald-400 mb-6">+${earnedXp} XP Earned</p>
      <div class="flex justify-center gap-3">
        <button onclick="startMiniGame('${activeGame}')" class="px-5 py-2.5 rounded-xl bg-brand-600 text-white font-bold text-xs">${UI_TEXT[state.lang].tryAgain}</button>
        <button onclick="activeGame = null; renderCurrentView();" class="px-5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold text-xs">Arcade Menu</button>
      </div>
    </div>
  `;
}

// --- MINI GAME 1: EQUATION RUSH ---
let currentEqProblem = null;
function genEquationProblem() {
  const type = Math.floor(Math.random() * 3);
  if (type === 0) {
    const x = Math.floor(Math.random() * 12) - 4;
    const a = Math.floor(Math.random() * 5) + 2;
    const b = Math.floor(Math.random() * 15) - 7;
    const c = a * x + b;
    return { prompt: `${a}x ${b >= 0 ? '+ ' + b : '- ' + Math.abs(b)} = ${c}`, ans: x };
  } else if (type === 1) {
    const x = Math.floor(Math.random() * 9) + 2;
    return { prompt: `x² = ${x * x}  (x > 0)`, ans: x };
  } else {
    const x = Math.floor(Math.random() * 6) + 1;
    return { prompt: `2ˣ = ${Math.pow(2, x)}`, ans: x };
  }
}

function renderEquationRushGame(container) {
  currentEqProblem = genEquationProblem();
  const options = new Set([currentEqProblem.ans]);
  while (options.size < 4) {
    options.add(currentEqProblem.ans + (Math.floor(Math.random() * 9) - 4));
  }
  const shuffled = [...options].sort(() => Math.random() - 0.5);

  container.innerHTML = renderGameShell(
    state.lang === 'en' ? 'Equation Rush' : 'Vergelyking-stormloop',
    `<p class="text-xs font-bold uppercase text-slate-400 mb-2">${state.lang === 'en' ? 'Solve for x:' : 'Los op vir x:'}</p>
     <div class="math-expr text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white my-6">${currentEqProblem.prompt}</div>
     <div class="grid grid-cols-2 gap-3 max-w-sm mx-auto">
       ${shuffled.map(opt => `
         <button onclick="answerMiniGame(${opt === currentEqProblem.ans})" class="py-3.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-brand-600 hover:text-white font-extrabold text-lg transition">
           x = ${opt}
         </button>
       `).join('')}
     </div>`
  );
}

// --- MINI GAME 2: PATTERN DETECTIVE ---
function renderPatternDetectiveGame(container) {
  const isQuad = Math.random() > 0.45;
  let seqText = '';
  let ans = 0;
  if (!isQuad) {
    const a = Math.floor(Math.random() * 10) + 1;
    const d = Math.floor(Math.random() * 8) - 2 || 3;
    seqText = `${a} ; ${a + d} ; ${a + 2 * d} ; ? ; ${a + 4 * d}`;
    ans = a + 3 * d;
  } else {
    const a = Math.floor(Math.random() * 3) + 1;
    const c = Math.floor(Math.random() * 5);
    const t = n => a * n * n + c;
    seqText = `${t(1)} ; ${t(2)} ; ${t(3)} ; ?`;
    ans = t(4);
  }
  const options = new Set([ans]);
  while (options.size < 4) options.add(ans + (Math.floor(Math.random() * 11) - 5));
  const shuffled = [...options].sort(() => Math.random() - 0.5);

  container.innerHTML = renderGameShell(
    state.lang === 'en' ? 'Pattern Detective' : 'Patroon-speurder',
    `<p class="text-xs font-bold uppercase text-slate-400 mb-2">${state.lang === 'en' ? 'Find the missing term (?):' : 'Vind die vermiste term (?):'}</p>
     <div class="math-expr text-2xl sm:text-3xl font-extrabold text-emerald-600 dark:text-emerald-400 my-6">${seqText}</div>
     <div class="grid grid-cols-2 gap-3 max-w-sm mx-auto">
       ${shuffled.map(opt => `
         <button onclick="answerMiniGame(${opt === ans})" class="py-3.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-emerald-600 hover:text-white font-extrabold text-lg transition">
           ${opt}
         </button>
       `).join('')}
     </div>`
  );
}

// --- MINI GAME 3: TRIG & ANGLE TARGET ---
const TRIG_CARDS = [
  { q: 'sin 30°', a: '½' }, { q: 'cos 60°', a: '½' }, { q: 'tan 45°', a: '1' },
  { q: 'sin 90°', a: '1' }, { q: 'cos 0°', a: '1' }, { q: 'sin²θ + cos²θ', a: '1' },
  { q: 'sin(180° - θ)', a: 'sin θ' }, { q: 'cos(90° - θ)', a: 'sin θ' },
  { q: 'tan(180° + θ)', a: 'tan θ' }, { q: 'cos(360° - θ)', a: 'cos θ' }
];
function renderTrigTargetGame(container) {
  const card = TRIG_CARDS[Math.floor(Math.random() * TRIG_CARDS.length)];
  const pool = ['½', '1', '0', '-1', 'sin θ', '-sin θ', 'cos θ', 'tan θ'];
  const options = new Set([card.a]);
  while (options.size < 4) options.add(pool[Math.floor(Math.random() * pool.length)]);
  const shuffled = [...options].sort(() => Math.random() - 0.5);

  container.innerHTML = renderGameShell(
    state.lang === 'en' ? 'Trig & Angle Target' : 'Trig & Hoek-teiken',
    `<p class="text-xs font-bold uppercase text-slate-400 mb-2">${state.lang === 'en' ? 'Simplify / Evaluate:' : 'Vereenvoudig / Bereken:'}</p>
     <div class="math-expr text-3xl sm:text-4xl font-extrabold text-purple-600 dark:text-purple-400 my-6">${card.q}</div>
     <div class="grid grid-cols-2 gap-3 max-w-sm mx-auto">
       ${shuffled.map(opt => `
         <button onclick="answerMiniGame(${opt === card.a})" class="py-3.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-purple-600 hover:text-white font-extrabold text-lg transition">
           ${opt}
         </button>
       `).join('')}
     </div>`
  );
}

function renderGameShell(title, innerHtml) {
  const t = UI_TEXT[state.lang];
  return `
    <div class="max-w-xl mx-auto bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-md text-center animate-pop">
      <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3 mb-4">
        <button onclick="clearGameTimers(); activeGame = null; renderCurrentView();" class="text-xs font-bold text-slate-500 hover:text-slate-800">
          <i class="fa-solid fa-arrow-left mr-1"></i> Exit
        </button>
        <span class="font-extrabold text-sm">${title}</span>
        <span id="miniGameTimer" class="px-2.5 py-1 rounded-lg bg-rose-100 dark:bg-rose-950 text-rose-600 dark:text-rose-400 font-extrabold text-xs">${gameTime}s</span>
      </div>
      <div class="flex justify-center gap-6 text-xs font-extrabold mb-2">
        <span class="text-brand-600 dark:text-brand-400">${t.scoreLabel}: ${gameScore}</span>
        <span class="text-amber-500">${t.comboLabel}: ${gameCombo}x</span>
      </div>
      ${innerHtml}
    </div>
  `;
}

function answerMiniGame(isCorrect) {
  if (isCorrect) {
    gameScore += 10 * gameCombo;
    gameCombo = Math.min(5, gameCombo + 1);
  } else {
    gameCombo = 1;
  }
  renderCurrentView();
}

// ============================================================================
// 8. INITIALIZE APPLICATION ON LOAD
// ============================================================================
window.addEventListener('DOMContentLoaded', () => {
  applyTheme();
  setLanguage(state.lang);
  updateGradeButtons();
  updateNavTabs();
  updateHeaderGamification();
  renderSidebar();
  renderCurrentView();
});
</script>
</body>
